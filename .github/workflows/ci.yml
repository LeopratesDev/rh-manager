name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    name: Web (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: ci-only-Placeholder1!
      JWT_KEY: ci-only-placeholder-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
